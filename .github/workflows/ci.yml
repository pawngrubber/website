name: ci

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate html
        run: |
          sudo apt-get install -y tidy
          find site -name '*.html' -print0 | xargs -0 -I {} sh -c 'tidy -qe "$1" || [ $? -eq 1 ]' _ {}
      - name: check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments site
          fail: true
