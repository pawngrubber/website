<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pawngrubber — building in the open">
  <title>pawngrubber — building in the open</title>

  <!--
    Social preview source. Colours and type are the site's own tokens
    (site/css/tokens.css, dark theme) — nothing here is fetched at render time.
      bg #0e1013 · surface #171b21 · line rgba(255,255,255,.09)
      text #e9e6e1 · text-2 #a5a49f · accent #e0a458
      board-light #f0d9b5 · board-dark #b58863 · on-mark #1a1206
    Rasterised to og-preview.png at exactly 1200x630. See the PR for the command.
  -->

  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d9b5"/>
      <stop offset="1" stop-color="#b58863"/>
    </linearGradient>

    <!-- the identity mark's pawn, drawn once and reused at two scales -->
    <g id="pawn">
      <circle cx="32" cy="19" r="9.5"/>
      <path d="M22.5 30.5h19a2.5 2.5 0 0 1 0 5h-19a2.5 2.5 0 0 1 0-5z"/>
      <path d="M26 36.5c0 8.5-3.4 12.8-6.8 18.5h25.6c-3.4-5.7-6.8-10-6.8-18.5z"/>
      <path d="M15.5 56h33a3 3 0 0 1 3 3v2.5h-39V59a3 3 0 0 1 3-3z"/>
    </g>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>

    <pattern id="board" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="64" fill="#f0d9b5" fill-opacity="0.035"/>
      <rect x="64" y="64" width="64" height="64" fill="#f0d9b5" fill-opacity="0.035"/>
    </pattern>

    <linearGradient id="boardFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <mask id="fadeRight">
      <rect x="0" y="0" width="1200" height="630" fill="url(#boardFade)"/>
    </mask>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="630" fill="#0e1013"/>
  <rect width="1200" height="630" fill="url(#board)" mask="url(#fadeRight)"/>
  <ellipse cx="1010" cy="230" rx="470" ry="380" fill="url(#glow)"/>

  <!-- oversized mark as quiet right-hand ballast -->
  <use href="#pawn" transform="translate(776 100) scale(6.4)" fill="#f0d9b5" fill-opacity="0.045"/>

  <!-- identity mark: the board-gradient tile from the site header, at card scale -->
  <g transform="translate(88 86)">
    <rect width="96" height="96" rx="22" fill="url(#mark)"/>
    <use href="#pawn" transform="translate(16 16) scale(1.03)" fill="#1a1206"/>
  </g>

  <!-- handle -->
  <text x="88" y="330"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="104" font-weight="600" letter-spacing="-2" fill="#e9e6e1">pawngrubber</text>

  <!-- accent rule -->
  <rect x="90" y="372" width="128" height="5" rx="2.5" fill="#e0a458"/>

  <!-- one line -->
  <text x="88" y="450"
        font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36" fill="#a5a49f">building in the open — stream, chess, and code</text>

  <!-- footer rule + domain -->
  <rect x="88" y="524" width="1024" height="1" fill="#ffffff" fill-opacity="0.09"/>
  <text x="88" y="574"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="28" letter-spacing="0.5" fill="#e0a458">pawngrubber.com</text>
</svg>
